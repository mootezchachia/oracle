services:
  sentinel:
    build: .
    image: xauusd-sentinel:1.0.0
    container_name: xauusd-sentinel
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      # Persist the signal journal and logs across container rebuilds — the
      # journal is what the learning layer optimises from, so losing it resets
      # the system's memory.
      - ./data:/app/data
      - ./logs:/app/logs
      # Edit config on the host without rebuilding.
      - ./config/config.yaml:/app/config/config.yaml:ro
    environment:
      TZ: UTC
      # Secrets come from the environment, never from the committed YAML.
      XAUUSD_NOTIFY__TELEGRAM__ENABLED: "${TELEGRAM_ENABLED:-false}"
      XAUUSD_NOTIFY__TELEGRAM__BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      XAUUSD_NOTIFY__TELEGRAM__CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      XAUUSD_NOTIFY__DISCORD__ENABLED: "${DISCORD_ENABLED:-false}"
      XAUUSD_NOTIFY__DISCORD__WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      XAUUSD_TRADINGVIEW__WEBHOOK_SECRET: "${TRADINGVIEW_WEBHOOK_SECRET:-}"
      XAUUSD_SIGNALS__MIN_CONFIDENCE: "${MIN_CONFIDENCE:-90}"
      XAUUSD_RISK__ACCOUNT_BALANCE: "${ACCOUNT_BALANCE:-10000}"
      XAUUSD_RISK__MAX_RISK_PERCENT: "${MAX_RISK_PERCENT:-1.0}"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
